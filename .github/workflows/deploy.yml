name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          set -o pipefail
          node -v
          npm -v
          npm install 2>&1 | tee /tmp/install.log
          status=${PIPESTATUS[0]}
          {
            echo '## npm install log'
            echo '```'
            tail -n 120 /tmp/install.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - run: npm run generate
      - name: Add .nojekyll
        run: touch .output/public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

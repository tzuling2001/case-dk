name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - name: Install dependencies
        run: |
          set +e
          npm ci --legacy-peer-deps > /tmp/install.log 2>&1
          status=$?
          set -e
          cat /tmp/install.log
          if [ "$status" -ne 0 ]; then
            tail -n 50 /tmp/install.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit "$status"
          fi
      - run: npm run generate
      - name: Add .nojekyll
        run: touch .output/public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
